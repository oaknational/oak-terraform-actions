---
# Example Github Workflow file to run Terraform Check action
name: Terraform Checks

on: [push, pull_request] # yamllint disable-line rule:truthy

jobs:
  example-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run Terraform Action from oak-terraform-actions
        # Please update the commit hash to the latest release of terraform-checks action before using
        uses: oaknational/oak-terraform-actions/actions/terraform-checks@d61b1d03471eeae76166188994f41f3261c57f40 # v1.10.0
