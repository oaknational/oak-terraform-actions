name: oak-terraform-linter CI

on:
  push:
    branches: [main]
    paths:
      - "oak-terraform-linter/**"
      - ".github/workflows/oak-terraform-linter-ci.yml"
  pull_request:
    paths:
      - "oak-terraform-linter/**"
      - ".github/workflows/oak-terraform-linter-ci.yml"

jobs:
  linter-ci:
    name: Lint, test, and build oak-terraform-linter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: oak-terraform-linter/package.json
          cache: "npm"
          cache-dependency-path: "oak-terraform-linter/package-lock.json"

      - name: Install dependencies
        working-directory: ./oak-terraform-linter
        run: npm ci

      - name: Check code formatting
        working-directory: ./oak-terraform-linter
        run: npx prettier --check src tests

      - name: Lint code
        working-directory: ./oak-terraform-linter
        run: npm run lint

      - name: Run tests
        working-directory: ./oak-terraform-linter
        run: npm test -- --coverage

      - name: Check TypeScript compilation
        working-directory: ./oak-terraform-linter
        run: npm run build
        env:
          NODE_ENV: production
